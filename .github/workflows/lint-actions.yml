name: Lint actions

on:
  pull_request:
    paths:
      - "actions/**"
      - ".github/workflows/**"
  push:
    paths:
      - "actions/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        shell: bash
        run: |
          mapfile -d '' yaml_files < <(
            find . -type f \( -name '*.yml' -o -name '*.yaml' \) \
              -not -path './.git/*' -print0
          )
          ((${#yaml_files[@]} > 0)) || { echo 'No YAML files found.' >&2; exit 1; }
          ruby -ryaml -e 'ARGV.each { |file| YAML.parse_file(file) }' "${yaml_files[@]}"

      - name: Run ShellCheck
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            find . -type f -name '*.sh' -not -path './.git/*' -print0
          )
          ((${#scripts[@]} > 0)) || { echo 'No shell scripts found.' >&2; exit 1; }
          shellcheck "${scripts[@]}"

      - name: Check Bash syntax and executable permissions
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            find . -type f -name '*.sh' -not -path './.git/*' -print0
          )
          for script in "${scripts[@]}"; do
            test -x "$script"
            bash -n "$script"
          done
